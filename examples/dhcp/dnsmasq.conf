# TomOS SCCP Cisco phone DHCP example for dnsmasq.
# Review the subnet, interface, router, DNS and TFTP addresses before use.
# This is an example only; it does not enable or replace your DHCP service.
#
# Keep this DHCP scope on the voice VLAN/subnet. Do not run a second
# authoritative DHCP server on a network that already has one.

# Bind dnsmasq to the voice interface (change to your interface name).
interface=eth1
bind-dynamic

# Example voice subnet and lease pool.
dhcp-range=192.168.10.100,192.168.10.199,255.255.255.0,12h
dhcp-option=option:router,192.168.10.1
dhcp-option=option:dns-server,192.168.10.1

# Cisco Option 150: primary TomOS TFTP server address.
# Replace 192.168.10.5 with the reachable IPv4 address of your TFTP server.
dhcp-option=150,192.168.10.5

# Optional: a second TFTP server can be added as another IPv4 value:
# dhcp-option=150,192.168.10.5,192.168.10.6

# Optional static reservation example:
# dhcp-host=00:11:22:AA:BB:CC,192.168.10.50,desk-phone,infinite
