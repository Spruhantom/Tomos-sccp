name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shell-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck php-cli
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n install-manager.sh
          php -l freepbx-module/tomos_sccp/page.tomos_sccp.php
          bash -n install-stack.sh
          bash -n scripts/tomos-sccp-install-tftp-templates.sh
          bash -n tests/test-tftp-templates.sh
          bash -n scripts/tomos-sccp-doctor.sh
          bash -n scripts/tomos-sccp-phone-check.sh
          bash -n tests/test-sccp-phone-check.sh
          bash -n tests/test-installer-static.sh
          bash -n tests/test-dhcp-examples.sh
      - name: ShellCheck
        run: shellcheck -S error install.sh install-manager.sh install-stack.sh scripts/tomos-sccp-doctor.sh scripts/tomos-sccp-phone-check.sh scripts/tomos-sccp-install-tftp-templates.sh tests/test-installer-static.sh tests/test-dhcp-examples.sh tests/test-tftp-templates.sh
      - name: Static installer checks
        run: bash tests/test-installer-static.sh && bash tests/test-dhcp-examples.sh && bash tests/test-tftp-templates.sh
      - name: modules.conf idempotence
        run: python3 tests/test-modules-conf.py
      - name: SCCP provisioning tests
        run: |
          python3 tests/test-sccp-provision.py
          python3 tests/test-sccp-tftp.py
          python3 tests/test-sccp-sep.py
          python3 tests/test-sccp-manager.py
          python3 tests/test-cisco-compatibility.py
          python3 tests/test-sccp-tftp-check.py
          bash tests/test-sccp-phone-check.sh
