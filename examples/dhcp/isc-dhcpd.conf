# TomOS SCCP Cisco phone DHCP example for ISC dhcpd.
# Review the subnet, router, DNS and TFTP addresses before use.
# This is an example only; it does not enable or replace your DHCP service.
#
# ISC DHCP is end-of-life. Use this only when maintaining an existing
# ISC DHCP deployment; consider a maintained DHCP server for new installs.

# Define Option 150 at top-level (outside subnet declarations).
# The array form supports one or more TFTP server IPv4 addresses.
option cisco-tftp-servers code 150 = array of ip-address;

subnet 192.168.10.0 netmask 255.255.255.0 {
  range 192.168.10.100 192.168.10.199;
  option subnet-mask 255.255.255.0;
  option routers 192.168.10.1;
  option domain-name-servers 192.168.10.1;

  # Replace with the reachable IPv4 address of the TomOS TFTP server.
  option cisco-tftp-servers 192.168.10.5;

  # Optional secondary TFTP server:
  # option cisco-tftp-servers 192.168.10.5, 192.168.10.6;
}

# Optional static reservation example (place inside the matching subnet):
# host desk-phone {
